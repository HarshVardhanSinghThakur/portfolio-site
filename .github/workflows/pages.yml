# Builds the site and publishes it to GitHub Pages on every push to main.
# Setup: repo Settings > Pages > Source = "GitHub Actions"; Settings > Secrets and variables > Actions > Variables:
# VITE_API_BASE = the API's address, e.g. https://api.yourname.me. The custom domain is set under Settings > Pages
# (with this kind of publishing GitHub ignores a CNAME file).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
